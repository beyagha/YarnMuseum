<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yarn</title>
  </head>
  <body>
    <div id="container">
      <form action="" method="get" id="formContainer">

        <div class="form">
          <label for="name">Name of the yarn : </label>
          <input type="text" name="name" id="name" required />
        </div>
        <div class="form">
          <label for="image">Link of the picture: </label>
          <input type="text" name="image" id="image" required />
        </div>
        <div class="form">
          <label for="wieght">Weight of the yarn : </label>
          <input type="number" step="0.01" name="wieght" id="wieght" required />
        </div>
        <div class="form">
          <label for="material">Material of the yarn: </label>
          <input type="text" name="material" id="material" required />
        </div>
        <div class="form">
          <label for="price">Price of the yarn : </label>
          <input type="number" step="0.01" name="price" id="price" required />
        </div>
        <div class="form">
          <label for="made">Country of fabrication : </label>
          <input type="text" name="made" id="made" required />
        </div>
        
        <div class="form">
          <label for="hook">Hook size : </label>
          <input type="text" name="hook" id="hook" required />
        </div>
        <div class="form">
          <label for="link">Link where you can buy it : </label>
          <input type="text" name="link" id="link" required />
        </div>

        <div class="form">
          <input type="submit" value="Subscribe!" />
        </div>
      </form>
      <div id="yarnContainers">
    <!-- <div class="yarnContainer"> -->
      
    </div>
    
  </div>
  </div>


    <script type="module" src="/src/main.js"></script>
  </body>
</html>
